<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopee MaFaDin Mart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Mini_Shopee.css">
    <script src="./Mini_Shopee.js" defer></script>
</head>
<body>

    <section id="login-page" class="page">
        <div class="login-card">
            <div class="login-form-side">
                <img src="./image.png"
                     alt="Logo MaFaDin Mart"
                     class="logo-mafadin">

                <h1>Masuk ke akunmu</h1>

                <p class="subtitle">
                    Gunakan username &amp; password akunmu.
                </p>

                <form id="login-form">

                    <label for="username">Username</label>
                    <input type="text" id="username" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" required>

                    <button type="submit" id="login-btn">Masuk</button>
                </form>
                <p id="login-message"></p>
            </div>

            <div class="login-art" aria-hidden="true">
                <div class="sun">
                <img src="./image.png" alt="Logo MaFaDin Mart"></div>
            <h2>Shopee MaFaDin Mart</h2>
            <h3>Belanja tanpa khawatir<br>Uang tergelincir 🛍️</h3>
            </div>
        </div>

    </section>
</body>
</html>
